<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ditty PA</title>
</head>
<body style="font-family:-apple-system,sans-serif;padding:28px;background:#111;color:#fff">
<p id="m">Loading Ditty PA…</p>
<p style="opacity:.7;font-size:14px">If this stays blank, close this sheet and open the link in Chrome.</p>
<script>
(function(){
  var hash = location.hash;
  fetch('https://cdn.jsdelivr.net/gh/cditt/ditty-pa@ba1cec9f0debe7697261c4188235c86422819583/index.html')
    .then(function(r){ if(!r.ok) throw new Error('fetch'); return r.text(); })
    .then(function(html){
      html = html.replace('</head>',
        '<link rel="stylesheet" href="weather-poster.css?v=3">'+
        '<link rel="stylesheet" href="portfolio-poster.css?v=18">'+
        '<link rel="stylesheet" href="vault-look.css?v=3">'+
        '</head>');
      document.open();
      document.write(html);
      document.close();
      if(hash){
        try{ history.replaceState(null,'',location.pathname+location.search+hash); }catch(e){}
      }
    })
    .catch(function(){
      var el=document.getElementById('m');
      if(el) el.textContent='Load failed. Open this URL in Chrome.';
    });
})();
</script>
</body>
</html>
