<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ditty PA</title>
</head>
<body style="font-family:-apple-system,sans-serif;padding:28px;background:#111;color:#fff">
<p id="m">Loading Ditty PA…</p>
<script>
(function(){
  var hash = location.hash;
  fetch('https://cdn.jsdelivr.net/gh/cditt/ditty-pa@ba1cec9f0debe7697261c4188235c86422819583/index.html')
    .then(function(r){ if(!r.ok) throw new Error('fetch'); return r.text(); })
    .then(function(html){
      html = html.replace('</head>',
        '<link rel="stylesheet" href="weather-poster.css?v=2">'+
        '<link rel="stylesheet" href="portfolio-poster.css?v=1">'+
        '</head>');
      html = html.replace('</body>', '<script src="portfolio-extra.js?v=1"><\/script></body>');
      document.open();
      document.write(html);
      document.close();
      if(hash){
        try{ history.replaceState(null,'',location.pathname+location.search+hash); }catch(e){}
      }
    })
    .catch(function(){
      document.getElementById('m').textContent='Load failed. Pull to refresh.';
    });
})();
</script>
</body>
</html>
